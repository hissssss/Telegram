name: telegram_ui_example
description: Gallery app for the telegram_ui package.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  telegram_ui:
    path: ../
  telegram_ui_lottie:
    path: ../../telegram_ui_lottie

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # tab_calls.json is TMessagesProj/src/main/res/raw/tab_calls.json (the
    # GlassTabView TabAnimation.CALLS composition) copied verbatim.
    - assets/lottie/tab_calls.json
