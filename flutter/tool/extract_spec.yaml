# extract_spec.yaml — curated (file, regex, name) scalar extraction list.
#
# Consumed by flutter/tool/extract_metrics.py (which ships its own stdlib-only
# parser for exactly the YAML subset used here: top-level scalars plus one
# list of flat maps; single-quoted strings; inline int lists).
#
# Each entry pulls one constant of ARCHITECTURE.md §3.4 out of the Telegram
# Android sources and emits it into
# flutter/telegram_ui/lib/src/tokens/glass_metrics.g.dart. If upstream Java
# drifts, either the regex stops matching (extraction fails loudly) or the
# value changes (surfaces as a codegen diff under --check).
#
# Entry keys:
#   name     Dart constant name (k-prefixed lowerCamelCase).
#   doc      one-line doc comment for the generated constant.
#   file     source path relative to the repo root.
#   pattern  Python regex; the value comes from capture group `group`.
#   kind     int | float | expr | color | int_list  (expr is evaluated,
#            e.g. '40 - 1.66f' -> 38.34; int_list reads the groups in `groups`).
#   dart     double | int | color | intList — emitted Dart type
#            (defaults: int->int, float/expr->double, color->color,
#            int_list->intList).
#   group    capture group index, default 1.
#   groups   capture group indices for int_list.
#   match    0-based match index when `matches` > 1, default 0.
#   matches  exact number of matches the pattern must produce, default 1.
#   dotall   apply re.DOTALL, default false.
#   equal    group indices whose parsed values must all be equal (sanity).
#
# Values suffixed `Dp` are logical dp — multiply by the device pixel ratio at
# runtime (dp() ceil semantics vs dpf2() exact float live in dimens.dart).

version: 1
output: 'flutter/telegram_ui/lib/src/tokens/glass_metrics.g.dart'

