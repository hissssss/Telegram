    file: 'TMessagesProj/src/main/java/org/telegram/ui/Components/blur3/drawable/BlurredBackgroundDrawableRenderNode.java'
    pattern: 'liquidThickness <= 0 \? dp\((\d+)\) :'
    kind: int
    dart: double
  - name: kGlassThicknessBoundsDivisor
    doc: 'Thickness is clamped to min(width, height) / this divisor (Java int division).'
    file: 'TMessagesProj/src/main/java/org/telegram/ui/Components/blur3/drawable/BlurredBackgroundDrawableRenderNode.java'
    pattern: 'Math\.min\(boundProps\.boundsWithPadding\.width\(\), boundProps\.boundsWithPadding\.height\(\)\) / (\d+)\), (\d+)\);'
    kind: int
  - name: kGlassThicknessMinPx
    doc: 'Absolute thickness floor in physical px after clamping.'
