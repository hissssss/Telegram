# groups.toml — prefix -> typed-group mapping for color_scheme.g.dart
# (stage 2 of the token codegen pipeline, ARCHITECTURE.md §4.3).
#
# Matching: for each color key (bare name, `key_` prefix stripped) the group
# with the LONGEST matching prefix wins.  Keys matching no prefix land in the
# UngroupedColors catch-all, and emit_dart.py lints: any ungrouped key not
# listed under [ungrouped].expected below is reported as newly-ungrouped
# (warning only — new upstream keys must never break generation).
#
# Group table key = accessor name on TelegramColorScheme (must be a valid,
# non-reserved Dart identifier).  `class` = generated wrapper class name.
# Member getters are the key name minus the matched prefix, camelized;
# emit_dart.py falls back to the camelized full key name when the remainder
# would be empty, start with a digit, or collide with a reserved word.

[groups.window]
class = "WindowColors"
prefixes = ["windowBackground"]
doc = "windowBackground* — window / page background and on-background text"

[groups.dialog]
class = "DialogColors"
prefixes = ["dialog"]
doc = "dialog* — alert dialog surfaces, text and controls"

[groups.actionBar]
class = "ActionBarColors"
prefixes = ["actionBar"]
doc = "actionBar* — action bar chrome, tabs, submenus"

[groups.chats]
class = "DialogsColors"
prefixes = ["chats_"]
doc = "chats_* — the dialogs (chat list) screen"

[groups.chat]
class = "ChatColors"
