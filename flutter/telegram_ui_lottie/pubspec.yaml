name: telegram_ui_lottie
description: >-
  package:lottie adapter for telegram_ui: implements the
  TabAnimationController playback contract of the glass tab bar so tab icons
  can be driven from Lottie compositions.
version: 0.1.0
publish_to: none # Companion to telegram_ui — see flutter/README.md.

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.0.0
  telegram_ui:
    path: ../telegram_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
